name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      # The formal Host Git package still pins Protocol as a nested Git dependency.
      # Use the Node 22 bundled npm until Host publishes a dependency-closed package.
      - run: npm ci
      - run: npm run check
      - name: Prepare the pinned CLIProxyAPI plugin host
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/router-for-me/CLIProxyAPI.git "$RUNNER_TEMP/cliproxy-source"
          git -C "$RUNNER_TEMP/cliproxy-source" fetch --depth 1 origin 85d2faddd17e6f4f8675a84ee28b131f702e8eaa
          git -C "$RUNNER_TEMP/cliproxy-source" checkout --detach FETCH_HEAD
      - name: Pack and verify the Linux and macOS resources
        run: |
          node scripts/sync-runtime-resources.mjs
          node scripts/sync-package-manifest.mjs
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/release-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release"
          archive="cordisx-plugin-cli-proxy-api-$(node -p "require('./package.json').version").tgz"
          tar -xzf "$RUNNER_TEMP/release/$archive" -C "$RUNNER_TEMP/release-package"
          node scripts/check-release-targets.mjs "$RUNNER_TEMP/release-package/package"
          (cd "$RUNNER_TEMP/release" && sha256sum "$archive" > SHA256SUMS)
      - name: Load the packaged Linux bridge through the real plugin host
        env:
          CLIPROXY_SOURCE: ${{ runner.temp }}/cliproxy-source
          CORDISX_GATEWAY_REPO: ${{ runner.temp }}/release-package/package
        run: node scripts/test-native-integration.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/*.tgz
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
