name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - run: test "$(npm --version)" = "12.0.2"
      - run: npm ci --allow-git=root
      - run: npm run check
